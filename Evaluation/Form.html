<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <fieldset>
            <h1>Donor Information</h1>
            <table>
                <tr>
                    <td><label for="name">First Name* </label></td>
                    <td><input type="text" id="name" name="name"></td>
                </tr>
                <tr>
                    <td><label for="name">Last Name* </label></td>
                    <td><input type="text" id="name" name="name"></td>
                </tr>
                <tr>
                    <td><label for="company">Company: </label></td>
                    <td><input type="text" id="company" name="company"></td>
                </tr>
                <tr>
                    <td><label for="address 1">Address 1* </label></td>
                    <td><input type="text" id="address 1" name="address 1"></td>
                </tr>
                <tr>
                    <td><label for="address 2">Address 2* </label></td>
                    <td><input type="text" id="address 2" name="address 2"></td>
                </tr>
                <tr>
                    <td><label for="city">City* </label></td>
                    <td><input type="text" id="city" name="city"></td>
                </tr>
                <tr>
                    <td><label for="state">State* </label></td>
                    <td>
                        <select id="state" name="state">
                            <option>Select Any State</option>
                            <option>Dhaka</option>
                            <option>Chittaging</option>
                            <option>Rajshahi</option>
                        </select>
                    </td>
                </tr>
                <td><label for="zip">Zip* </label></td>
                <td><input type="number" id="zip" name="zip">
                </td>
                <tr>
                    <td><label for="country">Country* </label></td>
                    <td>
                        <select id="country" name="country">
                            <option>Select Any Country</option>
                            <option>Bangladesh</option>
                            <option>India</option>
                            <option>Pakistan</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone">Phone </label></td>
                    <td><input type="tel" id="phone" name="phone"></td>
                </tr>
                <tr>
                    <td><label for="Fax">Fax </label></td>
                    <td><input type="tel" id="fax" name="fax"></td>
                </tr>
                <tr>
                    <td><label for="email">Email* </label></td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td><label>Donation Amount* </label></td>
                    <td>
                        <input type="radio" name="donation amount" value="None">None
                        <input type="radio" name="donation amount" value="$50">$50
                        <input type="radio" name="donation amount" value="$75">$75
                        <input type="radio" name="donation amount" value="$100">$100
                        <input type="radio" name="donation amount" value="$250">$250
                        <input type="radio" name="donation amount" value="Other">Other
                    </td>
                </tr>
                <td></td>
                <td><label for="other ">Other Amount $</label><input type="number" id="other" name="other"></td>
                </tr>
                <tr>
                    <td>
                        <label>Recurring Donation</label>
                        <p>(Check if yes)</p>
                    </td>
                    <td>
                        <input type="checkbox" value="yes">I am interested in giving on regular basis.
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td>
                        <label for="msg">Monthly Credit Card $</label>
                        <textarea id="msg" rows="1" cols="5"></textarea>For
                        <textarea id="msg" rows="1" cols="5"></textarea>Months
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>

</html>
